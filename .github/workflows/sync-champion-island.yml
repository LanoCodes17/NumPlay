name: Mirror Champion Island

# Champion Island lives in games/championisland. Its own repository,
# Mason363/NumWorks-Champion-Island, is a mirror of it: every push to main builds that
# repository's tree (tools/sync_champion.py), checks that it builds and passes its tests
# on its own, and commits it there if anything changed. Pull requests only do the checks.
#
# The push uses a deploy key with write access to the mirror alone; its private half is this
# repository's CHAMPION_ISLAND_DEPLOY_KEY secret.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one push at a time, so the mirror ends on the newest commit
concurrency:
  group: mirror-champion-island-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # the whole history: the mirror's commit takes its author and title from the last commit that touched the game
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The mirror
        if: env.PUSH == 'true'
        uses: actions/checkout@v4
        with:
          repository: Mason363/NumWorks-Champion-Island
          ssh-key: ${{ secrets.CHAMPION_ISLAND_DEPLOY_KEY }}
          path: champion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: pip install numpy pillow

      - name: Build the mirror's tree
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 tools/sync_champion.py champion ${{ env.PUSH == 'true' && '--commit' || '' }}

      - name: Build and test it on its own
        run: make -C champion host test

      - name: Push it
        if: env.PUSH == 'true'
        run: git -C champion push origin HEAD:main
